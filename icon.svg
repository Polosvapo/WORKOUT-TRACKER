<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sfondo nero con angoli arrotondati -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A"/>

  <!-- Impugnatura centrale -->
  <rect x="36" y="45" width="28" height="10" rx="4" fill="#39FF14"/>

  <!-- Braccio sinistro -->
  <rect x="22" y="47" width="16" height="6" rx="3" fill="#39FF14"/>
  <!-- Braccio destro -->
  <rect x="62" y="47" width="16" height="6" rx="3" fill="#39FF14"/>

  <!-- Disco sinistro esterno grande -->
  <rect x="10" y="36" width="13" height="28" rx="5" fill="#39FF14"/>
  <!-- Disco sinistro interno -->
  <rect x="21" y="40" width="7" height="20" rx="3" fill="#2BCF10"/>

  <!-- Disco destro interno -->
  <rect x="72" y="40" width="7" height="20" rx="3" fill="#2BCF10"/>
  <!-- Disco destro esterno grande -->
  <rect x="77" y="36" width="13" height="28" rx="5" fill="#39FF14"/>

  <!-- Glow effect sotto -->
  <rect x="10" y="36" width="13" height="28" rx="5" fill="none" stroke="#39FF14" stroke-width="1" opacity="0.4"/>
  <rect x="77" y="36" width="13" height="28" rx="5" fill="none" stroke="#39FF14" stroke-width="1" opacity="0.4"/>
</svg>
